{{- /* Needs params.{{SLUG}}.editBase, the repository path a page file
       sits under.
       Without it there is nowhere to send the reader. */ -}}
{{- with index site.Params "{{SLUG}}" "editBase" }}
<p class="edit-link">
  <a rel="external noopener" href="{{ . }}/{{ $.File.Path }}">{{ i18n "editThisPage" }}</a>
</p>
{{- end }}
