baseURL = "https://example.org/"
title = "Conformance"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 3

# Chroma's own colours are written into the markup as inline styles,
# and one of them fails AA contrast on every code block. Classes let the
# theme own its code colours, and its stylesheet fix them.
[markup.highlight]
  noClasses = false
  style = "xcode"

[markup.goldmark.renderer]
  unsafe = false

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [["$$", "$$"]]
    inline = [["$", "$"]]

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[languages.en]
  label = "English"
  weight = 1
[languages.nl]
  label = "Nederlands"
  weight = 2

[menus]
  [[menus.main]]
    name = "Kitchen sink"
    pageRef = "/kitchen-sink"
    weight = 10
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    name = "Nested"
    pageRef = "/kitchen-sink/sections"
    parent = "Kitchen sink"
    weight = 30

[outputs]
  home = ["html", "rss"]
  section = ["html", "rss"]

[params.privacyEmbeds]
  # Fetching a poster needs the network at build time. The conformance
  # build stays offline and deterministic, so it is off here.
  fetchPosters = false
