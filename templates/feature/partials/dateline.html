{{- /* The machine-readable form is the datetime attribute. The visible
       form follows the site language, so it is never hardcoded. */ -}}
{{- with .Date }}
<time class="dateline" datetime="{{ time.Format "2006-01-02T15:04:05-07:00" . }}">
  {{- time.Format ":date_long" . -}}
</time>
{{- end }}
